[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseshare"
version = "0.1.1"
description = "Share one mouse between a Mac and a Windows PC over the network, with a configurable screen layout"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pynput>=1.7"]

[project.scripts]
mouseshare = "mouseshare.__main__:main"

[tool.setuptools]
packages = ["mouseshare"]
