[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseshare"
version = "0.2.0"
description = "Share one keyboard and mouse between a Mac and a Windows PC over the network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pynput>=1.8",
  "pywebview>=5",
  "zeroconf>=0.130",
  "screeninfo>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff==0.16.6",
]

[project.scripts]
mouseshare = "mouseshare.__main__:main"

[tool.setuptools]
packages = ["mouseshare", "mouseshare.ui"]

[tool.setuptools.package-data]
"mouseshare.ui" = ["web/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs", "packaging/build", "packaging/dist"]

[tool.ruff.lint]
# Explicit so the result does not change with ruff's default rule set.
select = ["E4", "E7", "E9", "F", "I"]
