# Stack gate for MouseShare v2.
#
# Builds the packaged spike on both target platforms and runs its smoke
# mode inside the frozen artifact. Passing here proves the bundle is
# intact and pywebview/zeroconf/pynput coexist when frozen; it does NOT
# prove a window opens, which only a real desktop can show. Download the
# artifact and run it on a real Mac and PC before trusting the stack.
name: spike

on:
  push:
    branches: [redesign]
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: spike-macos
            run: ./dist/MouseShareSpike.app/Contents/MacOS/spike --smoke
          - os: windows-latest
            artifact: spike-windows
            run: ./dist/spike.exe --smoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pywebview zeroconf screeninfo pynput pyinstaller

      - name: Show resolved webview backend deps
        run: pip list

      - name: Build packaged spike
        run: pyinstaller --distpath dist --workpath build spike/spike.spec

      - name: Run smoke inside the frozen artifact
        run: ${{ matrix.run }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: dist/
