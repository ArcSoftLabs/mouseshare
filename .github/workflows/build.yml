name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -v

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: MouseShare-macos
          - os: windows-latest
            artifact: MouseShare-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/mouseshare.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          zip -j MouseShare-macos.zip MouseShare-macos/*
          zip -j MouseShare-windows.zip MouseShare-windows/*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseShare-macos.zip
            artifacts/MouseShare-windows.zip
