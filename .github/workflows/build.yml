name: build

on:
  push:
    branches: [main, redesign]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The core is deliberately importable without a display, so the whole
      # suite runs here. Capture, injection and monitor enumeration are
      # verified by hand on the real machines -- see the release checklist.
      - run: pip install pytest ruff==0.16.6 zeroconf screeninfo
      - run: ruff check mouseshare tests packaging tools
      - run: python -m pytest tests -v

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MouseShare-macos
            smoke: ./dist/MouseShare.app/Contents/MacOS/MouseShare --smoke
          - os: windows-latest
            artifact: MouseShare-windows
            smoke: ./dist/mouseshare.exe --smoke
          - os: ubuntu-22.04
            artifact: MouseShare-linux
            smoke: xvfb-run -a ./dist/mouseshare --smoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgtk-3-dev libwebkit2gtk-4.0-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.0 xvfb
      - run: pip install . pyinstaller
      - name: Install the Linux GTK Python bindings for bundling
        if: matrix.os == 'ubuntu-22.04'
        run: pip install PyGObject==3.46.0
      - run: pyinstaller packaging/mouseshare.spec
      # Run the frozen app, not just check a path exists. This is what
      # catches a missing hidden import, an unbundled web asset, or a
      # platform backend that only fails once packaged.
      - name: Smoke-test the frozen app
        shell: bash
        run: ${{ matrix.smoke }}
      - name: Ad-hoc sign so TCC identity is stable across rebuilds
        if: matrix.os == 'macos-latest'
        run: codesign --force --deep --sign - dist/MouseShare.app
      # Zip the bundle on macOS itself. Artifact upload normalises Unix
      # modes, so a raw .app arrives with its executable bit stripped and
      # the published build refuses to launch.
      - name: Archive the app bundle on the runner
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent dist/MouseShare.app dist/MouseShare-macos.zip
      - name: Build the Linux AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: bash packaging/linux/build-appimage.sh
      - name: Smoke-test the Linux AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./dist/MouseShare-x86_64.AppImage --smoke
      - name: Install nFPM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz -o dist/nfpm.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  dist/nfpm.tar.gz" | sha256sum --check
          tar -xzf dist/nfpm.tar.gz -C dist nfpm
      - name: Build Linux packages and tarball
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          export VERSION
          ./dist/nfpm package -f packaging/linux/nfpm.yaml -p deb -t "dist/mouseshare_${VERSION}_amd64.deb"
          ./dist/nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "dist/mouseshare-${VERSION}-1.x86_64.rpm"
          tar -czf dist/MouseShare-linux-x86_64.tar.gz -C dist mouseshare -C ../packaging/linux mouseshare.desktop -C ../icons MouseShare.png
          rm dist/mouseshare dist/appimagetool-x86_64.AppImage dist/runtime-x86_64 dist/nfpm dist/nfpm.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.os == 'macos-latest' && 'dist/MouseShare-macos.zip' || 'dist/' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          # macOS is already a ditto archive with its modes intact; only
          # Windows needs zipping here.
          zip -r MouseShare-windows.zip MouseShare-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseShare-macos/MouseShare-macos.zip
            artifacts/MouseShare-windows.zip
            artifacts/MouseShare-linux/MouseShare-x86_64.AppImage
            artifacts/MouseShare-linux/*.deb
            artifacts/MouseShare-linux/*.rpm
            artifacts/MouseShare-linux/MouseShare-linux-x86_64.tar.gz
