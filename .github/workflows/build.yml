name: build

on:
  push:
    branches: [main, redesign]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The core is deliberately importable without a display, so the whole
      # suite runs here. Capture, injection and monitor enumeration are
      # verified by hand on the real machines -- see the release checklist.
      - run: pip install pytest zeroconf screeninfo
      - run: python -m pytest tests -v

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MouseShare-macos
            smoke: ./dist/MouseShare.app/Contents/MacOS/MouseShare --smoke
          - os: windows-latest
            artifact: MouseShare-windows
            smoke: ./dist/mouseshare.exe --smoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/mouseshare.spec
      # Run the frozen app, not just check a path exists. This is what
      # catches a missing hidden import, an unbundled web asset, or a
      # platform backend that only fails once packaged.
      - name: Smoke-test the frozen app
        shell: bash
        run: ${{ matrix.smoke }}
      - name: Ad-hoc sign so TCC identity is stable across rebuilds
        if: matrix.os == 'macos-latest'
        run: codesign --force --deep --sign - dist/MouseShare.app
      # Zip the bundle on macOS itself. Artifact upload normalises Unix
      # modes, so a raw .app arrives with its executable bit stripped and
      # the published build refuses to launch.
      - name: Archive the app bundle on the runner
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent dist/MouseShare.app dist/MouseShare-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.os == 'macos-latest' && 'dist/MouseShare-macos.zip' || 'dist/' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          # macOS is already a ditto archive with its modes intact; only
          # Windows needs zipping here.
          zip -r MouseShare-windows.zip MouseShare-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MouseShare-macos/MouseShare-macos.zip
            artifacts/MouseShare-windows.zip
